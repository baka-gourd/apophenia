schema_version = 1

[command]
name = "cjxl"
binary = "cjxl"
description = "JPEG XL encoder"
supported_versions = ["0.12.0"]
version_commands = [["--version"]]
disable_help_flag = true

[[command.version_preprocessors]]
engine = "regex"
pattern = "(?s)^cjxl v(?P<version>[^[:space:]]+).*$"
replace = "$version"

[[command.options]]
id = "distance"
names = ["-d", "--distance"]
action = "value"
value_name = "DISTANCE"
help = "Target visual distance in JND units, range: 0.0 .. 25.0."
long_help = "Target visual distance in JND units, range: 0.0 .. 25.0. 0.0 = mathematically lossless, default for JPEG/GIF input. 1.0 = visually lossless, default for other input. Recommended range: 0.5 .. 3.0. Higher values allow more distortion. Mutually exclusive with --quality."
conflicts_with = ["quality"]

[[command.options]]
id = "quality"
names = ["-q", "--quality"]
action = "value"
value_name = "QUALITY"
help = "Internally mapped to --distance, range: 0 .. 100."
long_help = "Internally mapped to --distance, range: 0 .. 100. 100 = mathematically lossless. 90 = visually lossless. Quality values roughly match libjpeg quality. Recommended range: 68 .. 96. Mutually exclusive with --distance."
conflicts_with = ["distance"]

[[command.options]]
id = "effort"
names = ["-e", "--effort"]
action = "value"
value_name = "EFFORT"
default_value = "7"
help = "Encoder effort, range: 1 .. 10, default = 7."
long_help = "Encoder effort, range: 1 .. 10, default = 7. Higher values allow more computation, generally achieving smaller output at same quality. For lossy encoding, higher effort should achieve more accurate quality."

[[command.options]]
id = "version"
names = ["-V", "--version"]
action = "flag"
help = "Print encoder library version number and exit."

[[command.options]]
id = "quiet"
names = ["--quiet"]
action = "flag"
help = "Minimal printing."

[[command.options]]
id = "verbose"
names = ["-v", "--verbose"]
action = "count"
help = "Verbose printing; can be repeated and also applies to help."

[[command.options]]
id = "buffering"
names = ["--buffering"]
action = "value"
value_name = "-1..3"
default_value = "-1"
allow_negative_numbers = true
possible_values = ["-1", "0", "1", "2", "3"]
possible_values_help = [
  "Encoder chooses (default)",
  "Buffer the entire image; most memory and best compression",
  "Stream input for large images",
  "Stream input with a lower threshold",
  "Deprecated; use --output_mode to control output streaming",
]
help = "Control input buffering with a value from -1 to 3."
long_help = "Controls how much input buffering libjxl uses, affecting memory usage and compression quality. -1 = encoder chooses (default). 0 = buffer entire image (most memory, best compression). 1 = stream input for large images. 2 = stream input with a lower threshold. 3 = deprecated; use --output_mode to control output streaming."

[[command.options]]
id = "help"
names = ["-h", "--help"]
action = "help"
help = "Prints this help message. Add -v (up to a total of 4 times) to see more options."

[[command.arguments]]
id = "input"
position = 1
value_name = "INPUT"
required = true
value_hint = "file_path"
help = "the input can be JXL, PPM, PNM, PFM, PAM, PGX, PNG, APNG, GIF, JPEG"

[[command.arguments]]
id = "output"
position = 2
value_name = "OUTPUT"
required = true
value_hint = "file_path"
help = "the compressed JXL output file"
