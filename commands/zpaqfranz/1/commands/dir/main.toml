[command]
name = "dir"
description = "List files with cumulative directory sizes"
disable_help_flag = true
disable_version_flag = true
disable_help_subcommand = true

[[command.options]]
id = "recursive"
names = ["/s"]
action = "flag"
help = "Recurse into folders"

[[command.options]]
id = "order_size"
names = ["/os"]
action = "flag"
help = "Order by size"

[[command.options]]
id = "show_all"
names = ["/a"]
action = "flag"
help = "Show hidden files"

[[command.options]]
id = "nodir"
names = ["-nodir"]
action = "flag"
help = "Show files only"

[[command.arguments]]
id = "paths"
position = 1
value_name = "PATH"
multiple = true
value_hint = "any_path"
