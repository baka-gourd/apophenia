[command]
name = "download"
description = "Download a file from the Internet"
disable_help_flag = true
disable_version_flag = true
disable_help_subcommand = true

[[command.options]]
id = "checktxt"
names = ["-checktxt"]
action = "value"
value_name = "URL_OR_FILE"
help = "Check the downloaded file against a hash"

[[command.arguments]]
id = "url"
position = 1
value_name = "URL"
value_hint = "url"

[[command.arguments]]
id = "output"
position = 2
value_name = "FILE"
value_hint = "file_path"
