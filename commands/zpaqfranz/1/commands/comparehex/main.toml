[command]
name = "comparehex"
description = "Compare hexadecimal substitutions in two text files"
disable_help_flag = true
disable_version_flag = true
disable_help_subcommand = true

[[command.arguments]]
id = "first_file"
position = 1
value_name = "FILE"
value_hint = "file_path"
required = true

[[command.arguments]]
id = "second_file"
position = 2
value_name = "FILE"
value_hint = "file_path"
required = true

[[command.arguments]]
id = "haystack"
position = 3
value_name = "STRING"
required = true

[[command.arguments]]
id = "length"
position = 4
value_name = "LENGTH"
required = true
