[command]
name = "q"
description = "Back up the Windows C: drive"
disable_help_flag = true
disable_version_flag = true
disable_help_subcommand = true

[[command.options]]
id = "to"
names = ["-to"]
action = "value"
value_name = "DIR"
value_hint = "dir_path"
help = "Set the snapshot directory"

[[command.options]]
id = "frugal"
names = ["-frugal"]
action = "flag"
help = "Exclude Windows, Program Files, and temporary files"

[[command.arguments]]
id = "archive"
position = 1
value_name = "ARCHIVE"
value_hint = "file_path"
