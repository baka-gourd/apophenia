[command]
name = "testbackup"
description = "Check a multipart-managed backup"
disable_help_flag = true
disable_version_flag = true
disable_help_subcommand = true

[[command.options]]
id = "to"
names = ["-to"]
action = "value"
value_name = "DIR"
value_hint = "dir_path"
help = "Path to backup chunks"

[[command.options]]
id = "paranoid"
names = ["-paranoid"]
action = "flag"
help = "Compare the index with the chunks"

[[command.options]]
id = "checktxt"
names = ["-checktxt"]
action = "value"
value_name = "FILE"
value_hint = "file_path"
help = "Compare against an MD5 text file"

[[command.options]]
id = "range"
names = ["-range"]
action = "value"
value_name = "RANGE"
help = "Select a version range"

[[command.arguments]]
id = "archive"
position = 1
value_name = "ARCHIVE"
value_hint = "any_path"
