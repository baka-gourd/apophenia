[command]
name = "password"
description = "Change or remove a single archive password"
disable_help_flag = true
disable_version_flag = true
disable_help_subcommand = true

[[command.options]]
id = "key2"
names = ["-key2"]
action = "value"
value_name = "PASSWORD"
help = "New password"

[[command.arguments]]
id = "source"
position = 1
value_name = "ARCHIVE"
value_hint = "file_path"

[[command.arguments]]
id = "destination"
position = 2
value_name = "ARCHIVE"
value_hint = "file_path"
