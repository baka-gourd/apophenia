schema_version = 1

[command]
name = "zpaqfranz"
binary = "zpaqfranz"
description = "Top tier archiver with deduplication and hardware-assisted hashing"
disable_help_flag = true
disable_version_flag = true
disable_help_subcommand = true
supported_versions = ["*"]

# zpaqfranz uses one-dash long switches.  The command database keeps those
# spellings verbatim so the completion layer can present the same tokens as
# the program's help output.  The options below are the switches shared by
# the command family; command-specific switches live with their command.

[[command.options]]
id = "until"
names = ["-until"]
action = "value"
value_name = "VERSION_OR_DATE"
global = true
help = "Set a version or date limit"

[[command.options]]
id = "not"
names = ["-not"]
action = "value"
value_name = "PATTERN"
multiple = true
global = true
help = "Exclude matching files"

[[command.options]]
id = "only"
names = ["-only"]
action = "value"
value_name = "PATTERN"
multiple = true
global = true
help = "Include only matching files"

[[command.options]]
id = "always"
names = ["-always"]
action = "value"
value_name = "PATTERN"
multiple = true
global = true
help = "Always include matching files"

[[command.options]]
id = "noattributes"
names = ["-noattributes"]
action = "flag"
global = true
help = "Do not save file attributes or permissions"

[[command.options]]
id = "index"
names = ["-index"]
action = "value"
value_name = "FILE_OR_DIR"
global = true
help = "Create or use an archive index"

[[command.options]]
id = "715"
names = ["-715"]
action = "flag"
global = true
help = "Work like zpaq 7.15"

[[command.options]]
id = "all"
names = ["-all"]
action = "flag"
global = true
help = "Use all archive versions"

[[command.options]]
