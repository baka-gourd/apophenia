[package]
name = "apophenia"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env", "string", "unstable-ext"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
directories = "6"
minijinja = "2.24"
regex = "1.13"
reqwest = { version = "0.12.28" }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync"] }
tempfile = "3.27"
toml = "1.1"
walkdir = "2.5"
