name: Release binaries

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate SemVer tag on main
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          semver_regex='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag" =~ $semver_regex ]]; then
            echo "::notice::Skipping non-SemVer tag: $tag"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::notice::Skipping tag $tag because its commit is not on main"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "Tag $tag points to a commit on main"

  build:
    name: Build ${{ matrix.target }}
    needs: validate-tag
    if: needs.validate-tag.outputs.valid == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: apophenia
            asset: apophenia-linux-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: apophenia.exe
            asset: apophenia-windows-x86_64.exe
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "release-assets/${{ matrix.asset }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: apophenia-${{ matrix.target }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [validate-tag, build]
    if: needs.validate-tag.outputs.valid == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apophenia-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if ((${#assets[@]} == 0)); then
            echo "No release assets were produced" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
