name: Release binaries

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate SemVer tag on main
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          semver_regex='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag" =~ $semver_regex ]]; then
            echo "::notice::Skipping non-SemVer tag: $tag"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::notice::Skipping tag $tag because its commit is not on main"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "Tag $tag points to a commit on main"

  build:
    name: Build ${{ matrix.target }}
    needs: validate-tag
    if: needs.validate-tag.outputs.valid == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            builder: cargo
            binary: apophenia
            asset: apophenia-linux-x86_64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            builder: cross
            binary: apophenia
            asset: apophenia-linux-aarch64
          - runner: ubuntu-latest
            target: i686-unknown-linux-gnu
            builder: cross
            binary: apophenia
            asset: apophenia-linux-i686
          - runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            builder: cross
            binary: apophenia
            asset: apophenia-linux-armv7
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            builder: cargo
            binary: apophenia.exe
            asset: apophenia-windows-x86_64.exe
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            builder: cargo
            binary: apophenia.exe
            asset: apophenia-windows-aarch64.exe
          - runner: windows-latest
            target: i686-pc-windows-msvc
            builder: cargo
            binary: apophenia.exe
            asset: apophenia-windows-i686-msvc.exe
          - runner: ubuntu-latest
            target: x86_64-pc-windows-gnu
            builder: cross
            binary: apophenia.exe
            asset: apophenia-windows-x86_64-gnu.exe
          - runner: ubuntu-latest
            target: i686-pc-windows-gnu
            builder: cross
            binary: apophenia.exe
            asset: apophenia-windows-i686-gnu.exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            builder: cargo
            binary: apophenia
            asset: apophenia-macos-x86_64
          - runner: macos-latest
            target: aarch64-apple-darwin
            builder: cargo
            binary: apophenia
            asset: apophenia-macos-aarch64
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build binary with Cargo
        if: matrix.builder == 'cargo'
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Build binary with cross
        if: matrix.builder == 'cross'
        run: cross build --locked --release --target "${{ matrix.target }}"

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "release-assets/${{ matrix.asset }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: apophenia-${{ matrix.target }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [validate-tag, build]
    if: needs.validate-tag.outputs.valid == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source history
        uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apophenia-*
          path: release-assets
          merge-multiple: true

      - name: Update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          useGitmojis: false
          includeInvalidCommits: true
          reverseOrder: true
          excludeTypes: style,build
          writeToFile: true
        continue-on-error: true

      - name: Create or update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          artifacts: "release-assets/*"
          artifactErrorsFailBuild: true
          makeLatest: true
          allowUpdates: true
          body: ${{ steps.changelog.outputs.changes }}
          token: ${{ github.token }}

      - name: Commit CHANGELOG.md
        if: hashFiles('CHANGELOG.md') != ''
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: 'docs: update CHANGELOG.md for ${{ github.ref_name }} [skip ci]'
          file_pattern: CHANGELOG.md
